      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="660" rx="18" fill="#09090b"/>
  <rect x="1" y="1" width="958" height="658" rx="17" fill="none" stroke="rgba(255,255,255,0.1)"/>

  <text x="480" y="38" text-anchor="middle" fill="#fafafa" font-family="-apple-system,PingFang SC,sans-serif" font-size="18" font-weight="700">手机极速版 PWA 遥控（v1.6.5 全新原生一体式 UI）</text>
  <text x="480" y="60" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">无框沉浸排版 · 统一圆角输入卡（传图 / 切模型 / 切权限 / 语音）· 全屏随手右滑切会话</text>

