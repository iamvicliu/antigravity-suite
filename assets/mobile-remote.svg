    <text x="72" y="403" fill="#052e16" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">✅ 允许</text>
    <rect x="180" y="384" width="140" height="30" rx="8" fill="#3f3f46"/>
    <text x="224" y="403" fill="#f4f4f5" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">❌ 拒绝</text>

