    <g stroke="#082f49" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="306" y1="499" x2="306" y2="487"/>
      <polyline points="301 492 306 487 311 492"/>
    </g>

    <rect x="125" y="528" width="100" height="4" rx="2" fill="rgba(255,255,255,0.28)"/>
