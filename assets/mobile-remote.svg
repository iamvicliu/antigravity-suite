    <rect x="20" y="359" width="310" height="62" rx="10" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.4)"/>
    <text x="30" y="376" fill="#e4e4e7" font-family="ui-monospace,Menlo,monospace" font-size="11">请求执行: npm run build</text>
