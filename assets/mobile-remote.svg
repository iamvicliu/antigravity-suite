    <rect x="18" y="426" width="314" height="92" rx="22" fill="#16161a" stroke="rgba(255,255,255,0.12)"/>
    <text x="34" y="454" fill="#71717a" font-family="-apple-system,PingFang SC,sans-serif" font-size="13.5">发消息给 Antigravity…</text>

