    <rect x="10" y="42" width="330" height="48" fill="rgba(12,12,15,0.92)"/>
    <line x1="10" y1="90" x2="340" y2="90" stroke="rgba(255,255,255,0.07)"/>
    <g stroke="#a1a1aa" stroke-width="2" stroke-linecap="round">
      <line x1="25" y1="60" x2="39" y2="60"/>
      <line x1="25" y1="66" x2="39" y2="66"/>
      <line x1="25" y1="72" x2="34" y2="72"/>
