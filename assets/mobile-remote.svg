    <text x="42" y="250" fill="#e4e4e7" font-family="ui-monospace,Menlo,monospace" font-size="11">$ npx jest tests/cache.test.ts</text>
    <text x="42" y="266" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="11">PASS 6/6 tests (0.42s)</text>

    <text x="32" y="296" fill="#e4e4e7" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• 命中率提升至 </text>
    <text x="116" y="296" fill="#fff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">98.4%</text>
