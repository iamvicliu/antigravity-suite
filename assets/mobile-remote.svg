    <line x1="10" y1="428" x2="340" y2="428" stroke="rgba(255,255,255,0.1)"/>

    <rect x="20" y="436" width="112" height="24" rx="12" fill="rgba(139,92,246,0.18)" stroke="rgba(167,139,250,0.45)"/>
    <text x="30" y="452" fill="#ddd6fe" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">🧠 G4 Argon·M</text>
    <rect x="138" y="436" width="66" height="24" rx="12" fill="rgba(139,92,246,0.18)" stroke="rgba(167,139,250,0.45)"/>
