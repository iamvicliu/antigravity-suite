    <text x="188" y="497" fill="#fbbf24" font-size="11">⚡</text>
    <text x="202" y="497" fill="#d4d4d8" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="500">极速</text>

