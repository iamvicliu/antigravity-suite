    <circle cx="56" cy="60" r="3.5" fill="#34d399"/>
    <text x="66" y="64" fill="#fafafa" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" font-weight="600">重构 API 缓存层</text>
    <text x="52" y="80" fill="#71717a" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">108 tok/s · 84.2K (33%)</text>

    <rect x="242" y="49" width="88" height="34" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.09)"/>
    <text x="250" y="64" fill="#e4e4e7" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="600">G4 92% · C 86%</text>
    <text x="275" y="77" fill="#71717a" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.5">84.2K (33%)</text>

