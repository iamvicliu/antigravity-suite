<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
  <rect width="960" height="660" rx="18" fill="#09090b"/>
  <rect x="1" y="1" width="958" height="658" rx="17" fill="none" stroke="rgba(255,255,255,0.1)"/>

  <!-- 标题区 -->
  <text x="480" y="38" text-anchor="middle" fill="#f4f4f5" font-family="-apple-system,PingFang SC,sans-serif" font-size="18" font-weight="700">手机极速版 PWA 遥控面板（Tailscale / 同 Wi-Fi 内网直连）</text>
  <text x="480" y="60" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">独立全屏防杀后台 · 软键盘防遮挡 · 完整 Markdown 排版 · 全屏右滑切换会话</text>

  <!-- 左手机：主对话 + 模型/权限切换 + 传图/语音 + 审批卡片 -->
  <g transform="translate(88, 82)">
    <rect x="0" y="0" width="350" height="552" rx="38" fill="#111115" stroke="rgba(255,255,255,0.22)" stroke-width="2.5"/>
    <rect x="10" y="10" width="330" height="532" rx="30" fill="#09090b"/>
    <!-- 灵动岛 -->
    <rect x="130" y="18" width="90" height="20" rx="10" fill="#000"/>

