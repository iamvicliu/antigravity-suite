    <rect x="60" y="468" width="174" height="36" rx="10" fill="#18181b" stroke="rgba(255,255,255,0.16)"/>
    <text x="72" y="490" fill="#71717a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">发消息给桌面端…</text>
    <rect x="240" y="468" width="34" height="36" rx="9" fill="#27272a" stroke="rgba(255,255,255,0.12)"/>
    <text x="249" y="491" font-size="15">🎤</text>
    <rect x="280" y="468" width="50" height="36" rx="10" fill="#38bdf8"/>
    <text x="291" y="491" fill="#082f49" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">发送</text>

    <rect x="125" y="528" width="100" height="4" rx="2" fill="rgba(255,255,255,0.28)"/>
  </g>

