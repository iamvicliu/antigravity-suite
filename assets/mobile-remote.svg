    <line x1="10" y1="90" x2="340" y2="90" stroke="rgba(255,255,255,0.1)"/>
    <rect x="20" y="51" width="30" height="30" rx="8" fill="#27272a" stroke="rgba(255,255,255,0.12)"/>
    <text x="29" y="71" fill="#f4f4f5" font-size="14">☰</text>
    <circle cx="62" cy="61" r="4" fill="#34d399"/>
    <text x="72" y="65" fill="#f4f4f5" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">重构 API 缓存层</text>
    <text x="60" y="81" fill="#a1a1aa" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">Gemini 4 Argon · 108 tok/s</text>

    <rect x="242" y="49" width="88" height="34" rx="9" fill="#27272a" stroke="rgba(255,255,255,0.12)"/>
    <text x="250" y="64" fill="#f4f4f5" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">G4 92% · C 86%</text>
    <text x="275" y="78" fill="#a1a1aa" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">84.2K (33%)</text>

    <!-- 用户消息 -->
    <rect x="112" y="102" width="218" height="34" rx="12" fill="#0369a1"/>
    <text x="124" y="123" fill="#f0f9ff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">补充单测，然后运行检查看看</text>

    <!-- 助手 Markdown 富文本回复 -->
    <rect x="20" y="146" width="310" height="196" rx="12" fill="#18181b" stroke="rgba(255,255,255,0.1)"/>
    <rect x="30" y="156" width="290" height="26" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="40" y="173" fill="#93c5fd" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="600">💡 已思考 4s（点此展开中文思考过程）</text>

    <text x="32" y="202" fill="#fff" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" font-weight="700">一、已完成缓存淘汰测试</text>
    <text x="32" y="222" fill="#e4e4e7" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">已修改 </text>
    <rect x="74" y="210" width="90" height="16" rx="4" fill="rgba(56,189,248,0.16)"/>
    <text x="80" y="222" fill="#bae6fd" font-family="ui-monospace,Menlo,monospace" font-size="11">src/cache.ts</text>
    <text x="170" y="222" fill="#e4e4e7" font-family="-apple-system,PingFang SC,sans-serif" font-size="12"> 并补充 6 条边界用例：</text>

