    <text x="34" y="389" fill="#fff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="600">Orchestrator (Argon)</text>
    <text x="308" y="389" fill="#38bdf8" font-size="13">✓</text>
    <rect x="22" y="408" width="306" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)"/>
    <text x="34" y="429" fill="#e4e4e7" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">Gemini 4 Carbon (High)</text>
    <rect x="22" y="448" width="306" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)"/>
    <text x="34" y="469" fill="#e4e4e7" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">Claude Opus 5.5 (High)</text>
    <rect x="22" y="488" width="306" height="32" rx="10" fill="rgba(255,255,255,0.03)"/>
    <text x="34" y="508" fill="#a1a1aa" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">⚡ 极速 · 🛡️ 自动 · 🔒 默认 · 👁️ 请求审查</text>

