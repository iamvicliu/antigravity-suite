    <text x="34" y="387" fill="#fff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="600">Gemini 4 Argon (Medium)</text>
    <text x="308" y="387" fill="#38bdf8" font-size="13">✓</text>
    <rect x="22" y="406" width="306" height="34" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="34" y="427" fill="#e4e4e7" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">Claude Opus 5.5 (High)</text>
    <rect x="22" y="446" width="306" height="34" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="34" y="467" fill="#e4e4e7" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">⚡ 极速 (Turbo) · 🛡️ 自动 · 🔒 默认</text>
    <rect x="22" y="486" width="306" height="34" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
