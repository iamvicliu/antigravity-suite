  <rect x="832" y="120" width="274" height="540" rx="8" fill="#0d0d11" stroke="rgba(56,189,248,0.28)"/>
  <text x="846" y="148" fill="#93c5fd" font-family="ui-monospace,Menlo,monospace" font-size="12">export class MemoryCache {</text>
  <text x="846" y="170" fill="#e4e4e7" font-family="ui-monospace,Menlo,monospace" font-size="12">  private store = new Map();</text>
  <text x="846" y="192" fill="#e4e4e7" font-family="ui-monospace,Menlo,monospace" font-size="12">  get(key: string) {</text>
  <text x="846" y="214" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="12">    const entry = this.store.get(key);</text>
  <text x="846" y="236" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="12">    if (!entry) return null;</text>
  <text x="846" y="258" fill="#e4e4e7" font-family="ui-monospace,Menlo,monospace" font-size="12">    return entry.value;</text>
  <text x="846" y="280" fill="#e4e4e7" font-family="ui-monospace,Menlo,monospace" font-size="12">  }</text>
  <text x="846" y="302" fill="#93c5fd" font-family="ui-monospace,Menlo,monospace" font-size="12">}</text>
